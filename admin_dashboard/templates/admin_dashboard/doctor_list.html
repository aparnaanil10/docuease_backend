{% extends 'admin_dashboard/base.html' %}

{% block content %}
<h2 class="mb-4">Doctors List</h2>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for doctor in doctors %}
        <tr>
            <td>{{ doctor.id }}</td>
            <td>{{ doctor.name }}</td>
            <td>{{ doctor.specialization }}</td>
            <td>
                <a href="{% url 'doctor_detail' doctor.id %}" class="btn btn-info btn-sm">View</a>
                <a href="{% url 'doctor_delete' doctor.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No doctors found.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}

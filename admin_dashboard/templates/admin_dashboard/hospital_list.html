{% extends 'admin_dashboard/base.html' %}

{% block content %}
<h2 class="mb-4">Hospitals List</h2>

<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for hospital in hospitals %}
        <tr>
            <td>{{ hospital.id }}</td>
            <td>{{ hospital.name }}</td>
            <td>{{ hospital.location }}</td>
            <td>
                <a href="{% url 'hospital_detail' hospital.id %}" class="btn btn-info btn-sm">View</a>
                <a href="{% url 'hospital_delete' hospital.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No hospitals found.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}

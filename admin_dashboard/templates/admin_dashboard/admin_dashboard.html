<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Smart Appointment Admin</a>
  </div>
</nav>

<div class="container mt-4">
  <h1 class="mb-4">Dashboard</h1>

  <div class="row">
    <div class="col-md-4">
      <div class="card text-white bg-success mb-3">
        <div class="card-body">
          <h5 class="card-title">Doctors</h5>
          <p class="card-text">{{ doctors.count }} Doctors Registered</p>
          <a href="{% url 'doctor_list' %}" class="btn btn-light btn-sm">Manage Doctors</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-info mb-3">
        <div class="card-body">
          <h5 class="card-title">Hospitals</h5>
          <p class="card-text">{{ hospitals.count }} Hospitals Registered</p>
          <a href="{% url 'hospital_list' %}" class="btn btn-light btn-sm">Manage Hospitals</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-warning mb-3">
        <div class="card-body">
          <h5 class="card-title">Users</h5>
          <p class="card-text">{{ users.count }} Users Registered</p>
          <a href="{% url 'user_list' %}" class="btn btn-light btn-sm">Manage Users</a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>

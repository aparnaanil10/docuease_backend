{% extends 'admin_dashboard/base.html' %}

{% block content %}
<h2>Doctor Detail</h2>

<ul class="list-group mb-3">
    <li class="list-group-item"><strong>Name:</strong> {{ doctor.name }}</li>
    <li class="list-group-item"><strong>Specialization:</strong> {{ doctor.specialization }}</li>
    <li class="list-group-item"><strong>Hospital:</strong> {{ doctor.hospital.name }}</li>
</ul>

<a href="{% url 'doctor_list' %}" class="btn btn-secondary">Back to List</a>
{% endblock %}
